[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "solbreaker-server"
version = "0.1.0a1"
description = "Solbreaker multiplayer tank server compatible with build 11.21.0.1235_7376187"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/BUNDLED_LICENSES.txt", "licenses/manifest.json", "licenses/BLITZ.md"]
dependencies = ["lz4>=4.3,<5", "PyYAML>=6,<7", "cryptography>=43", "numpy>=1.24,<3", "pybullet==3.2.7; sys_platform == 'linux'"]

[project.scripts]
solbreaker = "solbreaker.cli:main"

[project.urls]
Repository = "https://github.com/unisequence/Solbreaker"
Issues = "https://github.com/unisequence/Solbreaker/issues"
Changelog = "https://github.com/unisequence/Solbreaker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = ["pybullet==3.2.7; sys_platform == 'win32'", "numpy>=1.24,<2; sys_platform == 'win32'"]
gui = ["PySide6-Essentials>=6.8,<7"]
tui = ["textual>=1,<9"]
support = ["Cython==3.3.1", "setuptools==84.2.1"]

[tool.setuptools.packages.find]
include = ["solbreaker*"]
namespaces = false

[tool.setuptools.package-data]
solbreaker = ["native/*/Cargo.toml", "native/*/Cargo.lock", "native/*/abi.h", "native/*/src/*.rs", "native/support_checks/*.pyx", "native/*.c", "native/*.h", "native/*.S", "native/*.inc", "assets/*.png", "assets/*.ico", "assets/*.json", "assets/*.json.gz"]
