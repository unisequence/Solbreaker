name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit Git contents
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            python tools/audit_repository.py --base "$BASE"
          else
            python tools/audit_repository.py
          fi
      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/solbreaker-ci"
          for profile in gui tui; do
            "$RUNNER_TEMP/solbreaker-ci/bin/python" tools/install_dependencies.py --profile "$profile"
          done
      - name: Build native libraries
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          RUSTUP_TOOLCHAIN=1.85.0 "$RUNNER_TEMP/solbreaker-ci/bin/python" tools/build_native.py --jobs 2
      - name: Run tests
        run: '"$RUNNER_TEMP/solbreaker-ci/bin/python" -m unittest discover -s tests'
      - name: Check the source package
        run: python tools/package_source.py --output "$RUNNER_TEMP/Solbreaker-source.zip"
