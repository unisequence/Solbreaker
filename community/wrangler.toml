name = "solbreaker-benchmarks"
main = "worker.mjs"
compatibility_date = "2025-11-18"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "RESULTS"
database_name = "solbreaker-benchmarks"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "SUBMISSIONS"
namespace_id = "10001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "GLOBAL_SUBMISSIONS"
namespace_id = "10002"
simple = { limit = 90, period = 60 }
